<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TaskFlow</title>
    <link rel="stylesheet" href="{% static 'form.css' %}">
</head>
<body>
    <div class="container">
        <h1>TaskFlow</h1>
        <p style="margin-bottom: 24px; font-size: 15px;">Welcome back! Please login to your account.</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
            </div>
            
            <button type="submit" style="margin-top: 8px;">Login</button>
        </form>
        
        <div style="margin-top: 24px; text-align: center; font-size: 14px; color: var(--text-muted);">
            Don't have an account? <a href="{% url 'register' %}" style="font-weight: 600;">Sign up</a>
        </div>
    </div>
</body>
</html>
