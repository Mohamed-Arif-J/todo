<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task - Todo Tasks</title>
    <link rel="stylesheet" href="{% static 'form.css' %}?v=2">
</head>
<body>
    <div class="container">
        <h1>Edit Task</h1>
        <p>Modify task details and save changes.</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="task">Task Description</label>
                <input type="text" id="task" name="task" placeholder="Task description" value="{{ todo.task }}" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="date">Deadline</label>
                <input type="date" id="date" name="date" value="{{ todo.date|date:'Y-m-d' }}" required>
            </div>
            
            <div class="update-actions">
                <button type="submit" style="flex: 1;">Save Changes</button>
                <a href="{% url 'dashboard' %}" class="btn btn-secondary" style="flex: 1;">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
