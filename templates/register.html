<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Todo Tasks</title>
    <link rel="stylesheet" href="{% static 'form.css' %}?v=2">
</head>
<body>
    <div class="container">
        <h1>Todo Tasks</h1>
        <p>Create a new account.</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" autocomplete="new-password" required>
            </div>
            
            <button type="submit">Sign Up</button>
        </form>
        
        <div style="margin-top: 16px; text-align: center; font-size: 14px;">
            Already have an account? <a href="{% url 'login' %}">Login</a>
        </div>
    </div>
</body>
</html>
